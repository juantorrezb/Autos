spring.application.name=backend
#Cofiguracion del puerto del backend
server.port=4040

# Configuracion de base datos postgreSQL
#jdbc = java data base connector
spring.datasource.url=jdbc:posgresql://localhost:5450/telovendo_db
spring.datasource.username = postgres
spring.datasource.password= admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA (Crea y actulia las tablas de forma automatica)
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true