services:
  postgres-db:
    image: postgres:15-alpine
    container_name: auto_postgres
    environment:
      POSTGRES_DB: Autos_bd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: 